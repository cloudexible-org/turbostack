name: CI

# Validation only — lint (including the changelog guard), typecheck and build.
# Deployment is handled elsewhere (see docs/infrastructure.md): this workflow
# builds to validate, not to deploy.
# The build step exists because `typecheck` alone can pass while the build is
# broken: `tsc` is a standalone binary, but Next drives the TypeScript compiler
# API programmatically, so a compiler that fails to load breaks the build while
# leaving typecheck green.
# Unit tests (@repo/ui Storybook stories) and the e2e suites run in a real
# browser and are run locally via `pnpm test` and `pnpm test:e2e`, not in CI.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Turbo Remote Caching (shared with Vercel builds). Both are optional — Turbo
# falls back to local cache when unset, so CI works before they're configured.
# To enable: add a TURBO_TOKEN repo secret (a Vercel access token) and a
# TURBO_TEAM repo variable (your Vercel team slug).
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  validate:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On a pull request, HEAD is the merge into the base branch and
          # HEAD^1 is the base, which the changelog guard diffs against.
          fetch-depth: 2

      - name: Install pnpm
        # Version is read from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Only a release writes docs/changelog.md; every other change adds a
      # fragment to docs/changelog.d/, so parallel PRs never conflict on it.
      # A PR that has to touch it anyway (a typo in a released entry) carries
      # the `changelog-edit` label.
      - name: Changelog guard
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'changelog-edit')
        run: node scripts/changelog/cli.mjs check --pr HEAD^1

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Placeholder, not a secret. `apps/www` validates its env at build time
          # and requires a well-formed URL here; only the shape matters, since
          # prerendering never opens a connection. Everything else the apps read
          # is optional and is skipped when absent.
          NEXT_PUBLIC_CONVEX_URL: https://ci-build-placeholder.convex.cloud
