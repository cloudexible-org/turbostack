name: CI

# Validation only — lint, typecheck and build.
# Deployment is handled by Vercel; this workflow builds to validate, not to deploy.
# The build step exists because `typecheck` alone can pass while the build is
# broken: `tsc` is a standalone binary, but Next drives the TypeScript compiler
# API programmatically, so a compiler that fails to load breaks the build while
# leaving typecheck green.
# Unit tests (@repo/ui Storybook stories) run in a real browser and are run
# locally via `pnpm test`, not in CI.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Turbo Remote Caching (shared with Vercel builds). Both are optional — Turbo
# falls back to local cache when unset, so CI works before they're configured.
# To enable: add a TURBO_TOKEN repo secret (a Vercel access token) and a
# TURBO_TEAM repo variable (your Vercel team slug).
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  validate:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        # Version is read from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Placeholder, not a secret. `apps/www` validates its env at build time
          # and requires a well-formed URL here; only the shape matters, since
          # prerendering never opens a connection. Everything else the apps read
          # is optional and is skipped when absent.
          NEXT_PUBLIC_CONVEX_URL: https://ci-build-placeholder.convex.cloud

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # Only chromium — both projects (app, www) use Desktop Chrome.
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e
        env:
          # No Convex local backend in CI. Starting one means downloading the
          # backend binary and provisioning a deployment on a cold runner for
          # every push. With this off, the `app` and `www` projects still run —
          # they assert only statically-rendered chrome and client-side
          # behaviour — and the `app-convex` project, which needs real seeded
          # data, is not registered at all. Run it locally with `pnpm test:e2e`.
          E2E_CONVEX: "0"
          # Placeholders, not secrets — same rationale as the build job above.
          # `apps/app` validates VITE_CONVEX_URL at startup and `apps/www`'s
          # env.ts requires a well-formed NEXT_PUBLIC_CONVEX_URL, so the shape
          # has to be right; neither is ever connected to, because the specs
          # assert only on statically-rendered chrome and client-side animation
          # state. Giving this suite a real deployment is what §8 of
          # docs/e2e-architecture.md is about — do that before writing any spec
          # that reads or writes messages.
          #
          # The Clerk and PostHog keys are deliberately NOT set: both apps treat
          # them as optional and skip those surfaces entirely when absent, and
          # no spec may depend on them.
          VITE_CONVEX_URL: https://ci-e2e-placeholder.convex.cloud
          NEXT_PUBLIC_CONVEX_URL: https://ci-e2e-placeholder.convex.cloud

      - name: Upload report
        # Only useful when something failed; the run is otherwise silent.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
